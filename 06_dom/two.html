<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM | chai aur code</title>
  </head>
  <body style="background-color: #212121; color: #fff">
    <div class="parent">
      <!-- this is comment -->
      <div class="day">Monday</div>
      <div class="day">Tuesday</div>
      <div class="day">Wednesday</div>
      <div class="day">Thursday</div>
    </div>
  </body>

  <script>
    const parent = document.querySelector(".parent");
    console.log(parent);
    console.log(parent.children); // it will html collection of child
    console.log(parent.children[1].innerHTML);

    // above is html collection which looks like an array , but it does not have array like property ,
    // but for loop still can work on it

    for (let i = 0; i < parent.children.length; i++) {
      console.log(parent.children[i].innerHTML);
    }

    parent.children[1].style.color = "orange";

    // esme parents se child nodes pe aasakte hai.
    console.log(parent.firstElementChild);
    console.log(parent.lastElementChild);

    const dayOne = document.querySelector(".day"); // query selectore fist element ko he select karta hai ,, jab ki qierySelectorAll sare ko ek node me retuurn karta hai

    console.log(dayOne);
    // child node se parent node pe bhi jaa sakte hai
    console.log(dayOne.parentElement);
    
    console.log(dayOne.nextElementSibling);

    console.log("Nodes : ", parent.childNodes);
    // ek enter bhi ek text node me count hota hai , lekin sirf ek enter he .
    // like next line me jane ke liye enter lagate hai to .
  </script>
</html>
