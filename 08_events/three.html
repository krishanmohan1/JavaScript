<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chai aur Javascript</h1>

    <button id="start">Start</button>
     
    <button id="stop" >Stop</button>

    <script>

    let intervalId ;

      const sayDate = function(str){
        console.log('Hello', str, Date.now().toLocaleString());
      }
      
      const startDate = function(){
        if(!intervalId){
            intervalId = setInterval(sayDate , 1000, "Krishan")
        }
      }

      const stopDate = function(){
        clearInterval(intervalId)
        intervalId = null
      }

    document.querySelector('#start').addEventListener('click', startDate)
    document.querySelector('#stop').addEventListener('click',stopDate)


      




    </script>
</body>
</html>
