</head>
<body style="background-color: #212121; color: white;">
    
    <!-- Value	State	Description
0	UNSENT	Client has been created. open() not called yet.
1	OPENED	open() has been called.
2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
3	LOADING	Downloading; responseText holds partial data.
4	DONE	The operation is complete. -->

<div id="profile">

</div>

</body>

<script>
    // before fetch(), XMLHttpReques() were used , it is related AJAX
    // XML request ko he AJAX request bolte hai , ye jada kama me nhi aata hai , but legacy code me aata hai pahle se jo code bana hua hai

    // open()  he request bhejta hai , ye do parameter leta hai , 
    // ek http request method , and ek string basically url 
    
    const xhr = new XMLHttpRequest()    // ye object banaye hai .
    const requestURL =  'https://api.github.com/users/krishanmohan1'

    xhr.open('GET', requestURL);

        console.log(xhr.readyState);    // ye readystate ko continuously change jo ho rha hai usko dikhata hai 
        if(xhr.readyState === 4){
            // url se jab se request aata hai to max time wo string me aata hai , so usko JSON object bananne ke

            console.log(typeof data)
            console.log(data)

            card.style.backgroundColor = '#333'
            card.style.textAlign = 'center'
            card.style.marginTop = '20px'

            avatar.style.height = '100px'
            avatar.style.borderRadius = '50%'

            // name

</script>
